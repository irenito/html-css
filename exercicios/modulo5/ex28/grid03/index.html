<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout na prática 3</title>

    <style>
        div.container{
            border: 3px solid blue;
            /* quando tiro o height do container, ele sera o tamanho suficiente p caber as 3 rows*/

            display: grid;

            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 1fr 2fr 1fr; /* o width é dividido em 4 partes e o meio ficará com 2 partes*/

            grid-auto-flow: column; /* por padrão é rows, ou seja, vai colocar os itens em linhas */
            grid-auto-rows:80px ; /* minha configuração é 3 columns e 3 rows, 9 itens. Com essa propriedade, posso colocar uma medida para todo item acrescentado além. Caso contrário, o novo item será do tamanho do conteúdo.*/ 
            grid-auto-columns: 120px;
            /* o item j é o meu grid implicito */

            gap:5px; /*espaço entre os itens*/
        
            place-items: normal normal; /* align-items dps justify-items*/
            place-content: normal normal; /* align-content dps justify-content*/
            


        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
